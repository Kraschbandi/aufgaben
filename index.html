<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#FFFBFE">
  <meta name="color-scheme" content="light dark">
  <title>Aufgaben</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    /* =================================================================
       Aufgaben – Material 3. Alle Farben kommen als CSS-Variablen aus
       applyColors() (Tonpalette aus einer Grundfarbe oder dem Hintergrundbild).
       ================================================================= */
    :root {
      --primary: #6750A4; --on-primary: #fff; --primary-container: #EADDFF; --on-primary-container: #21005D;
      --secondary-container: #E8DEF8; --on-secondary-container: #1D192B;
      --tertiary-container: #FFD8E4; --on-tertiary-container: #31111D;
      --surface: #FFFBFE; --surface-lowest: #fff; --surface-low: #F7F2FA; --surface-container: #F3EDF7;
      --surface-high: #ECE6F0; --surface-highest: #E6E0E9; --on-surface: #1D1B20; --on-surface-variant: #49454F;
      --outline: #79747E; --outline-variant: #CAC4D0; --inverse-surface: #322F35; --inverse-on-surface: #F5EFF7;
      --inverse-primary: #D0BCFF; --error: #B3261E; --on-error: #fff; --error-container: #F9DEDC; --on-error-container: #410E0B;
      --star: #9A6700;
      --font: Roboto, "Google Sans Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      --ease: cubic-bezier(.2, 0, 0, 1);          /* M3 "emphasized" */
      --safe-top: max(env(safe-area-inset-top), var(--safe-area-inset-top, 0px));
      --safe-bottom: max(env(safe-area-inset-bottom), var(--safe-area-inset-bottom, 0px));
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--surface); color: var(--on-surface); font-family: var(--font);
      font-size: 16px; line-height: 1.5; }
    body { min-height: 100vh; padding-bottom: calc(var(--safe-bottom) + 96px); transition: background-color .3s; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    .hidden, [hidden] { display: none !important; }
    svg.i { width: 24px; height: 24px; fill: currentColor; flex: none; display: block; }
    svg.i.s18 { width: 18px; height: 18px; }
    svg.i.s20 { width: 20px; height: 20px; }

    /* Zustandsebene (Hover/Druck) wie bei Material */
    .sl { position: relative; overflow: hidden; isolation: isolate; }
    .sl::after { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; z-index: -1;
      transition: opacity .15s; border-radius: inherit; pointer-events: none; }
    .sl:active::after { opacity: .12; }
    @media (hover: hover) { .sl:hover::after { opacity: .08; } }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* ---------- Obere App-Leiste ---------- */
    .appbar { position: sticky; top: 0; z-index: 10; background: var(--surface);
      padding: calc(var(--safe-top) + 8px) 4px 0; transition: background-color .2s; }
    .appbar.scrolled { background: var(--surface-container); }
    .bar-row { display: flex; align-items: center; min-height: 56px; gap: 4px; padding: 0 4px 0 12px; }
    .bar-title { flex: 1; min-width: 0; }
    .bar-title h1 { margin: 0; font-size: 28px; font-weight: 400; line-height: 36px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .bar-title .sub { font-size: 14px; color: var(--on-surface-variant); line-height: 20px; }
    .icon-btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
      color: var(--on-surface-variant); flex: none; }
    .search-row { display: flex; align-items: center; gap: 4px; margin: 4px 12px; height: 56px;
      background: var(--surface-high); border-radius: 28px; padding: 0 4px; }
    .search-row input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 16px;
      color: var(--on-surface); }
    .search-row input::placeholder { color: var(--on-surface-variant); }

    /* Listen als Filter-Chips */
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px;
      border: 1px solid var(--outline-variant); border-radius: 8px; font-size: 14px; font-weight: 500;
      color: var(--on-surface-variant); white-space: nowrap; background: none; }
    .chip.on { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent;
      padding-left: 8px; }
    .chip.add { padding-left: 8px; color: var(--primary); }
    .chip svg.i { width: 18px; height: 18px; }

    /* Segmentierter Knopf offen/erledigt/alle */
    .seg { display: flex; margin: 4px 16px 12px; border: 1px solid var(--outline); border-radius: 20px; overflow: hidden; }
    .seg button { flex: 1; height: 40px; font-size: 14px; font-weight: 500; display: flex; align-items: center;
      justify-content: center; gap: 8px; color: var(--on-surface); }
    .seg button + button { border-left: 1px solid var(--outline); }
    .seg button.on { background: var(--secondary-container); color: var(--on-secondary-container); }
    .seg button svg.i { width: 18px; height: 18px; display: none; }
    .seg button.on svg.i { display: block; }

    /* Nur im Browser, wenn sich die Web-App installieren lässt (nie in der Android-App) */
    .btn.install { display: none; margin: 0 16px 12px; }
    .btn.install.show { display: inline-flex; }

    /* ---------- Aufgaben-Karten ---------- */
    main { max-width: 720px; margin: 0 auto; }
    #list { list-style: none; margin: 0; padding: 0 12px; display: grid; gap: 8px; }
    #list > li { position: relative; display: flex; gap: 4px; align-items: flex-start; padding: 8px 8px 8px 0;
      background: var(--surface-low); border-radius: 16px; touch-action: pan-y;
      transition: transform .2s var(--ease), opacity .2s, background-color .2s; animation: enter .3s var(--ease); }
    @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
    #list.drag-active > li { animation: none; }
    #list > li.swiping { transition: none; }
    #list > li[data-swipe=done] { background: var(--primary-container); }
    #list > li[data-swipe=del] { background: var(--error-container); }
    #list > li.starred { background: color-mix(in srgb, var(--surface-low) 88%, var(--star)); }
    #list > li.done { background: none; border: 1px solid var(--outline-variant); }
    #list > li.flash { box-shadow: 0 0 0 2px var(--primary); }
    #list > li.dragging { z-index: 3; background: var(--surface-high);
      box-shadow: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3); }
    .handle { flex: none; width: 32px; height: 40px; display: grid; place-items: center; color: var(--outline);
      touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; margin-left: 2px; }
    .no-handle { width: 8px; flex: none; }
    body.no-select { user-select: none; -webkit-user-select: none; }

    /* Runde Checkbox mit Animation */
    .check { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
    .check .ring { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--on-surface-variant);
      display: grid; place-items: center; transition: background-color .2s, border-color .2s; }
    .check .ring svg { width: 16px; height: 16px; fill: var(--on-primary); transform: scale(0); transition: transform .2s var(--ease); }
    .check.on .ring { background: var(--primary); border-color: var(--primary); }
    .check.on .ring svg { transform: scale(1); }
    .check.pop .ring { animation: pop .3s var(--ease); }
    @keyframes pop { 50% { transform: scale(1.25); } }

    .body { flex: 1; min-width: 0; padding: 8px 0 4px; cursor: pointer; }
    .title { font-size: 16px; line-height: 24px; word-wrap: break-word; }
    li.done .title { text-decoration: line-through; color: var(--on-surface-variant); }
    li.done .body { cursor: default; }
    .note { margin-top: 2px; font-size: 14px; line-height: 20px; color: var(--on-surface-variant); white-space: pre-wrap;
      word-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .subs { margin-top: 4px; display: grid; }
    .sub { display: flex; gap: 10px; align-items: center; min-height: 36px; font-size: 14px; text-align: left; padding: 0 4px 0 0;
      border-radius: 8px; }
    .sub .box { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--on-surface-variant); flex: none;
      display: grid; place-items: center; transition: background-color .15s; }
    .sub .box svg { width: 14px; height: 14px; fill: var(--on-primary); opacity: 0; }
    .sub.done .box { background: var(--primary); border-color: var(--primary); }
    .sub.done .box svg { opacity: 1; }
    .sub.done span:last-child { text-decoration: line-through; color: var(--on-surface-variant); }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px;
      font-size: 12px; font-weight: 500; background: var(--surface-high); color: var(--on-surface-variant); }
    .badge svg.i { width: 14px; height: 14px; }
    .badge.due { background: var(--secondary-container); color: var(--on-secondary-container); }
    .badge.today { background: var(--primary-container); color: var(--on-primary-container); }
    .badge.late { background: var(--error-container); color: var(--on-error-container); }
    .meta { margin-top: 4px; font-size: 12px; color: var(--on-surface-variant); opacity: .8; }
    .thumb { flex: none; width: 56px; height: 56px; object-fit: cover; border-radius: 12px; margin-top: 8px; cursor: zoom-in; }
    .side { flex: none; display: flex; flex-direction: column; align-items: center; }
    .side .icon-btn { width: 40px; height: 40px; }
    .star.on { color: var(--star); }
    .empty { text-align: center; padding: 56px 24px; color: var(--on-surface-variant); }
    .empty .art { width: 120px; height: 120px; margin: 0 auto 16px; border-radius: 50%; background: var(--primary-container);
      color: var(--on-primary-container); display: grid; place-items: center; }
    .empty .art svg { width: 64px; height: 64px; }
    .empty h2 { margin: 0 0 4px; font-size: 22px; font-weight: 400; color: var(--on-surface); }
    .footer-actions { text-align: center; margin-top: 16px; }
    .credit { margin: 32px 0 0; text-align: center; font-size: 12px; color: var(--on-surface-variant); opacity: .7; }

    /* ---------- Knöpfe ---------- */
    .btn { height: 40px; padding: 0 24px; border-radius: 20px; font-size: 14px; font-weight: 500; letter-spacing: .1px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
    .btn svg.i { width: 18px; height: 18px; }
    .btn.filled, .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
    .btn.outlined { border: 1px solid var(--outline); color: var(--primary); }
    .btn.text, .link { color: var(--primary); padding: 0 12px; }
    .btn.danger { color: var(--error); }
    .btn:disabled { opacity: .38; }

    /* FAB */
    .fab { position: fixed; right: 16px; bottom: calc(var(--safe-bottom) + 16px); z-index: 15; height: 56px;
      min-width: 56px; padding: 0 16px; border-radius: 16px; background: var(--primary-container);
      color: var(--on-primary-container); display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500;
      box-shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 8px 3px rgba(0,0,0,.15); transition: padding .25s var(--ease); }
    .fab .lbl { max-width: 200px; overflow: hidden; white-space: nowrap; transition: max-width .25s var(--ease), opacity .2s; }
    .fab.small .lbl { max-width: 0; opacity: 0; margin-left: -12px; }
    .fab.away { transform: translateY(150%); }

    /* ---------- Bottom Sheets & Dialoge ---------- */
    .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.32); display: flex; align-items: flex-end;
      justify-content: center; opacity: 0; pointer-events: none; transition: opacity .25s; }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .sheet-box { width: 100%; max-width: 640px; max-height: calc(100% - var(--safe-top) - 24px); overflow-y: auto;
      background: var(--surface-low); color: var(--on-surface); border-radius: 28px 28px 0 0;
      padding: 0 24px calc(var(--safe-bottom) + 24px); transform: translateY(100%); transition: transform .3s var(--ease);
      overscroll-behavior: contain; }
    .scrim.show .sheet-box { transform: none; }
    .grab { width: 32px; height: 4px; border-radius: 2px; background: var(--on-surface-variant); opacity: .4;
      margin: 16px auto 12px; }
    .sheet-box h2 { margin: 4px 0 16px; font-size: 24px; font-weight: 400; line-height: 32px; }
    .dialog { align-items: center; padding: 24px; }
    .dialog .sheet-box { border-radius: 28px; max-width: 420px; padding: 24px; transform: scale(.92); opacity: 0;
      transition: transform .25s var(--ease), opacity .2s; background: var(--surface-high); }
    .dialog.show .sheet-box { transform: none; opacity: 1; }

    /* Felder */
    .field { position: relative; display: block; }
    .field input, .field textarea, .field select { width: 100%; min-height: 56px; padding: 16px; border-radius: 4px;
      border: 1px solid var(--outline); background: transparent; color: var(--on-surface); outline: none; font-size: 16px;
      color-scheme: inherit; }
    .field textarea { min-height: 88px; resize: vertical; line-height: 1.4; }
    .field input:focus, .field textarea:focus, .field select:focus { border: 2px solid var(--primary); padding: 15px; }
    .field .fl { position: absolute; left: 12px; top: -9px; padding: 0 4px; font-size: 12px; line-height: 16px;
      color: var(--on-surface-variant); background: var(--surface-low); }
    .field:focus-within .fl { color: var(--primary); }
    .dialog .field .fl { background: var(--surface-high); }
    .dlg-body { margin: -4px 0 4px; color: var(--on-surface-variant); line-height: 1.45; }
    #dlgField { margin-top: 16px; }
    .btn.filled.danger-filled { background: var(--error); color: var(--on-error); }
    .big-input { width: 100%; border: 0; outline: none; background: none; font-size: 20px; line-height: 28px;
      padding: 8px 0; color: var(--on-surface); }
    .big-input::placeholder { color: var(--on-surface-variant); }

    /* Auswahl-Chips im "Neue Aufgabe"-Sheet: echte Auswahlfelder liegen unsichtbar darüber */
    .assist { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
    .assist .chip { position: relative; }
    .assist .chip.set { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }
    .assist .chip input, .assist .chip select { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer;
      color-scheme: inherit; }
    .cmd-preview { display: none; flex-wrap: wrap; gap: 6px; margin: 4px 0 0; }
    .cmd-preview.show { display: flex; }
    .cmd-preview span { height: 24px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 6px;
      font-size: 12px; font-weight: 500; background: var(--tertiary-container); color: var(--on-tertiary-container); }
    .cmd-preview span.warn { background: var(--error-container); color: var(--on-error-container); }
    .preview { display: none; position: relative; width: 88px; height: 88px; margin-top: 12px; }
    .preview.show { display: block; }
    .preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
    .preview button { position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%;
      background: var(--inverse-surface); color: var(--inverse-on-surface); display: grid; place-items: center; }
    .preview button svg { width: 16px; height: 16px; }
    .sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    .sheet-actions .grow { flex: 1; }

    /* Bearbeiten */
    .edit-form { display: grid; gap: 16px; padding-top: 4px; }
    .edit-form .label { font-size: 14px; font-weight: 500; color: var(--on-surface-variant); margin-bottom: -8px; }
    .subs-edit { display: grid; gap: 6px; }
    .sub-edit { display: flex; gap: 4px; align-items: center; }
    .sub-edit input { flex: 1; min-width: 0; height: 48px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--outline);
      background: none; outline: none; color: var(--on-surface); }
    .sub-edit input:focus { border: 2px solid var(--primary); padding: 0 11px; }
    .sub-edit button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
      color: var(--on-surface-variant); flex: none; }
    .sub-handle { width: 32px; height: 40px; display: grid; place-items: center; color: var(--outline);
      touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; flex: none; }
    .sub-row.sub-dragging { background: var(--surface-high); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .absorb-list { display: grid; gap: 4px; padding: 8px; border-radius: 12px; background: var(--surface-container);
      max-height: 240px; overflow-y: auto; }
    .absorb-item { text-align: left; padding: 12px; border-radius: 8px; font-size: 14px; }
    .edit-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .remind-row { display: flex; gap: 4px; align-items: center; }
    .remind-row .field { flex: 1; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px;
      font-size: 16px; }
    .edit-photo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .edit-photo img { width: 72px; height: 72px; object-fit: cover; border-radius: 12px; }

    /* Schalter (Material Switch) */
    .switch { position: relative; width: 52px; height: 32px; flex: none; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
    .switch .track { position: absolute; inset: 0; border-radius: 16px; border: 2px solid var(--outline);
      background: var(--surface-highest); transition: background-color .2s, border-color .2s; }
    .switch .knob { position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--outline); transition: all .2s var(--ease); }
    .switch input:checked ~ .track { background: var(--primary); border-color: var(--primary); }
    .switch input:checked ~ .knob { left: 24px; top: 4px; width: 24px; height: 24px; background: var(--on-primary); }

    /* Einstellungen */
    .section { margin: 20px 0 8px; font-size: 14px; font-weight: 500; color: var(--primary); }
    .set-row { display: flex; align-items: center; gap: 16px; min-height: 56px; }
    .set-row .grow { flex: 1; min-width: 0; }
    .set-row .hint { font-size: 14px; color: var(--on-surface-variant); line-height: 20px; }
    .lang-select { height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline); background: none;
      color: var(--on-surface); color-scheme: inherit; }
    .swatches { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0; }
    .swatch { width: 52px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px;
      color: var(--on-surface-variant); text-align: center; line-height: 14px; }
    .swatch .dot { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; position: relative;
      overflow: hidden; outline: 2px solid transparent; outline-offset: 2px; transition: outline-color .15s; }
    .swatch .dot::before { content: ""; position: absolute; inset: 0; background: var(--a); }
    .swatch .dot::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: var(--b); }
    .swatch .dot svg { position: relative; z-index: 1; width: 20px; height: 20px; fill: #fff; opacity: 0;
      filter: drop-shadow(0 0 2px rgba(0,0,0,.5)); }
    .swatch.on .dot { outline-color: var(--primary); }
    .swatch.on .dot svg { opacity: 1; }
    .swatch.on { color: var(--on-surface); font-weight: 500; }
    .list-manage { display: grid; gap: 8px; }
    .lm { display: flex; gap: 4px; align-items: center; }
    .lm input { flex: 1; min-width: 0; height: 48px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--outline);
      background: none; outline: none; color: var(--on-surface); }
    .lm input:focus { border: 2px solid var(--primary); padding: 0 11px; }
    .muted-note { font-size: 14px; color: var(--on-surface-variant); line-height: 20px; margin-top: 8px; }
    .help-list { display: grid; gap: 4px; }
    .help-row { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--outline-variant); }
    .help-row code, .muted-note code { font-family: ui-monospace, "Roboto Mono", monospace; font-size: 14px; color: var(--primary); }
    .help-row span { font-size: 14px; color: var(--on-surface-variant); }

    /* Snackbar */
    .toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--safe-bottom) + 88px); z-index: 40; max-width: 560px;
      margin: 0 auto; min-height: 48px; padding: 6px 8px 6px 16px; border-radius: 4px; background: var(--inverse-surface);
      color: var(--inverse-on-surface); display: flex; align-items: center; gap: 8px; font-size: 14px;
      box-shadow: 0 2px 6px 2px rgba(0,0,0,.15), 0 1px 2px rgba(0,0,0,.3);
      transform: translateY(24px); opacity: 0; pointer-events: none; transition: transform .25s var(--ease), opacity .2s; }
    .toast.show { transform: none; opacity: 1; pointer-events: auto; }
    .toast span { flex: 1; }
    .toast button { color: var(--inverse-primary); font-weight: 500; padding: 0 12px; height: 40px; border-radius: 20px; }

    /* Vollbild-Foto */
    .viewer { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.92); display: none; align-items: center;
      justify-content: center; }
    .viewer.show { display: flex; }
    .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* Einführung */
    .tut-step { font-size: 14px; color: var(--on-surface-variant); }

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(mode) { return db.transaction(STORE, mode).objectStore(STORE); }
function dbAll() { return new Promise(res => { const r = tx('readonly').getAll(); r.onsuccess = () => res(r.result); }); }
function dbPut(t) { return new Promise(res => { const r = tx('readwrite').put(t); r.onsuccess = () => res(); }); }
function dbDel(id) { return new Promise(res => { const r = tx('readwrite').delete(id); r.onsuccess = () => res(); }); }

async function toggle(t) {
  if (editingId === t.id) closeLayer('editSheet');
  const before = { done: t.done, doneAt: t.doneAt };
  t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
  haptic(t.done ? 'confirm' : 'tick');
  let spawned = null;
  if (t.done) {
    await cancelReminder(t);
    if (t.repeat) {
      // Wiederkehrend: die nächste Runde kommt sofort als neue offene Aufgabe
      spawned = {
        ...t, id: uid(), done: false, doneAt: null, created: Date.now(), order: topOrder(),
        subs: (t.subs || []).map(s => ({ ...s, id: uid(), done: false })),
        remind: t.remind ? nextOccurrence(t.remind, t.repeat) : null,
      };
      await dbPut(spawned); todos.push(spawned); scheduleReminder(spawned);
    }
  } else {
    scheduleReminder(t);
  }
  await dbPut(t); render();
  if (t.done) toast(tr(spawned ? 'toastDoneRepeat' : 'toastDone', { x: t.text }), async () => {
    t.done = before.done; t.doneAt = before.doneAt; await dbPut(t); scheduleReminder(t);
    if (spawned) { await cancelReminder(spawned); await dbDel(spawned.id); todos = todos.filter(x => x.id !== spawned.id); }

}

}

  todos = todos.filter(x => x.id !== t.id); render();

// ---------- Wischen: rechts = erledigt, links = löschen ----------
function attachSwipe(li, t) {
  let x0 = null, y0 = 0, dx = 0, active = false, armed = false;
  li.addEventListener('pointerdown', e => {
    if (drag || e.target.closest('button, img, input, textarea, select, .handle')) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; active = false; armed = false;
  });
  li.addEventListener('pointermove', e => {
    if (x0 === null || drag) return;
    dx = e.clientX - x0;
    if (!active && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(e.clientY - y0) * 1.5) {
      active = true; li.classList.add('swiping'); try { li.setPointerCapture(e.pointerId); } catch {}
    }
    if (active) {
      li.style.transform = `translateX(${dx}px)`;
      li.dataset.swipe = dx > 0 ? 'done' : 'del';
      const over = Math.abs(dx) > li.offsetWidth * 0.35;
      if (over !== armed) { armed = over; if (over) haptic(); }
      li.style.opacity = String(1 - Math.min(Math.abs(dx) / 500, .4));
    }
  });
  const end = async () => {
    if (x0 === null) return;
    x0 = null; li.classList.remove('swiping');
    if (!active) return;
    active = false;
    const w = li.offsetWidth * 0.35;
    if (dx > w) { li.style.transform = 'translateX(110%)'; setTimeout(() => toggle(t), 150); return; }
    if (dx < -w) { li.style.transform = 'translateX(-110%)'; setTimeout(() => remove(t), 150); return; }
    li.style.transform = ''; li.style.opacity = ''; delete li.dataset.swipe;
  };
  li.addEventListener('pointerup', end);
  li.addEventListener('pointercancel', end);
}

// ---------- Ziehen zum Sortieren (Griff) ----------
// Das gezogene Element bleibt im DOM (sonst verliert Android den Finger);
// es folgt dem Finger per transform, die anderen rücken per transform.
let drag = null;
function startDrag(e, li, t) {
  if (drag) return;
  e.preventDefault();
  const items = [...$('list').querySelectorAll('li[data-id]:not(.done)')];
  const from = items.indexOf(li);
  if (from < 0) return;
  haptic('long');
  const sy = scrollY;
  const rects = items.map(el => { const r = el.getBoundingClientRect(); return { top: r.top + sy, h: r.height }; });
  const gap = items.length > 1 ? rects[1].top - (rects[0].top + rects[0].h) : 8;
  drag = { li, items, from, to: from, rects, gap, startPage: e.clientY + sy, pointer: e.pointerId, lastY: e.clientY, raf: 0 };
  li.classList.add('dragging');
  $('list').classList.add('drag-active');
  document.body.classList.add('no-select');
  items.forEach(el => { if (el !== li) el.style.transition = 'transform .2s cubic-bezier(.2,0,0,1)'; });
  li.style.transition = 'none';
  addEventListener('pointermove', dragMove, { passive: false });
  addEventListener('pointerup', dragEnd);
  addEventListener('pointercancel', dragEnd);
  drag.raf = requestAnimationFrame(autoScroll);
}
function dragMove(e) {
  if (!drag || e.pointerId !== drag.pointer) return;
  e.preventDefault();

  layoutDrag();
}
function layoutDrag() {
  const d = drag;
  const dy = d.lastY + scrollY - d.startPage;
  d.li.style.transform = `translateY(${dy}px) scale(1.02)`;
  const center = d.rects[d.from].top + d.rects[d.from].h / 2 + dy;
  let to = 0;
  d.rects.forEach((r, i) => { if (i !== d.from && r.top + r.h / 2 < center) to++; });
  if (to !== d.to) haptic();
  d.to = to;
  const shift = d.rects[d.from].h + d.gap;
  d.items.forEach((el, i) => {
    if (i === d.from) return;
    let off = 0;
    if (d.from < to && i > d.from && i <= to) off = -shift;
    if (to < d.from && i >= to && i < d.from) off = shift;
    el.style.transform = off ? `translateY(${off}px)` : '';
  });
}
function autoScroll() {
  if (!drag) return;
  const edge = 90, y = drag.lastY;
  let v = 0;
  if (y < edge + 120) v = -Math.ceil((edge + 120 - y) / 6);
  else if (y > innerHeight - edge) v = Math.ceil((y - (innerHeight - edge)) / 6);
  if (v) { scrollBy(0, v); layoutDrag(); }
  drag.raf = requestAnimationFrame(autoScroll);
}
async function dragEnd(e) {
  if (!drag || (e && e.pointerId !== drag.pointer)) return;
  const d = drag; drag = null;
  cancelAnimationFrame(d.raf);
  removeEventListener('pointermove', dragMove);
  removeEventListener('pointerup', dragEnd);
  removeEventListener('pointercancel', dragEnd);
  d.items.forEach(el => { el.style.transform = ''; el.style.transition = ''; });
  d.li.classList.remove('dragging');
  $('list').classList.remove('drag-active');
  document.body.classList.remove('no-select');
  if (d.to === d.from) return;
  const ids = d.items.map(el => el.dataset.id);
  const [moved] = ids.splice(d.from, 1);
  ids.splice(d.to, 0, moved);
  // In die Plätze aller offenen Aufgaben einsetzen, damit andere Listen ihre Reihenfolge behalten
  const open = todos.filter(x => !x.done).sort((a, b) => sortKey(a) - sortKey(b));
  const visibleSet = new Set(ids);
  let k = 0;
  const byId = new Map(todos.map(y => [y.id, y]));
  const merged = open.map(x => (visibleSet.has(x.id) ? byId.get(ids[k++]) : x));
  for (const [i, x] of merged.entries()) {
    if (x.order !== i) { x.order = i; await dbPut(x); }
  }
  render();
}

// ---------- Kurzbefehle im Textfeld ----------
// "Einkauf #liste ! @morgen 9:00 *w > milch > brot // notiz"
const fold = x => x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/[^a-z0-9+:.\-]/g, '');
const langOrder = () => [lang, ...Object.keys(WEEKDAYS).filter(l => l !== lang)];
function dayWord(w) {
  for (const l of langOrder()) {
    if (DAY_WORDS.today[l]?.includes(w)) return { kind: 'today' };
    if (DAY_WORDS.tomorrow[l]?.includes(w)) return { kind: 'tomorrow' };
    const i = WEEKDAYS[l].findIndex(names => names.includes(w));
    if (i >= 0) return { kind: 'weekday', day: i + 1 };
  }
  return null;
}
const TIME_RE = /^(\d{1,2})(?::(\d{2}))?(?:h|uhr)?$/;
function parseTime(x, bareOk) {
  const m = fold(x).match(TIME_RE);
  if (!m) return null;
  if (!bareOk && !/[:h]|uhr/.test(fold(x))) return null;
  const h = +m[1], min = +(m[2] || 0);
  return h < 24 && min < 60 ? { h, min } : null;
}
function at(date, time, fallback = { h: 9, min: 0 }) {
  const d = new Date(date); const tm = time || fallback;
  d.setHours(tm.h, tm.min, 0, 0); return d;
}
function parseWhen(spec, next) {
  const now = new Date(), w = fold(spec);
  const rel = w.match(/^\+(\d+)(m|min|h|std|d|t)$/);
  if (rel) {
    const n = +rel[1], mult = { m: 6e4, min: 6e4, h: 36e5, std: 36e5, d: 864e5, t: 864e5 }[rel[2]];
    return { ts: Date.now() + n * mult, usedNext: false };
  }
  const nextTime = next ? parseTime(next, false) : null;
  const own = parseTime(spec, true);
  if (own) {
    let d = at(now, own); if (d <= now) d.setDate(d.getDate() + 1);
    return { ts: d.getTime(), usedNext: false };
  }
  const word = dayWord(w);
  if (word) {
    let d = new Date(now);
    if (word.kind === 'tomorrow') d.setDate(d.getDate() + 1);
    if (word.kind === 'weekday') {
      const today = ((now.getDay() + 6) % 7) + 1;
      let diff = (word.day - today + 7) % 7;
      d.setDate(d.getDate() + diff);
      if (diff === 0 && at(d, nextTime) <= now) d.setDate(d.getDate() + 7);
    }
    if (word.kind === 'today' && !nextTime) {
      d = new Date(now); d.setHours(d.getHours() + 1, 0, 0, 0);
      return { ts: d.getTime(), usedNext: false };
    }
    return { ts: at(d, nextTime).getTime(), usedNext: !!nextTime };
  }
  const dm = w.match(/^(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?$/) || null;
  const iso = w.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (dm || iso) {
    const [y, mo, day] = iso ? [+iso[1], +iso[2], +iso[3]] : [dm[3] ? (+dm[3] < 100 ? 2000 + +dm[3] : +dm[3]) : now.getFullYear(), +dm[2], +dm[1]];
    let d = at(new Date(y, mo - 1, day), nextTime);
    if (!iso && !dm[3] && d <= now) d.setFullYear(d.getFullYear() + 1);
    if (isNaN(d)) return null;
    return { ts: d.getTime(), usedNext: !!nextTime };
  }

}
function parseCommand(raw) {
  const out = { text: '', list: null, star: false, remind: null, repeat: '', subs: [], note: null, unknown: [] };
  let text = raw;
  const ni = text.indexOf('//');
  if (ni >= 0) { out.note = text.slice(ni + 2).trim() || null; text = text.slice(0, ni); }
  const segs = text.split(/\s+>\s*/);

  const tokens = text.split(/\s+/).filter(Boolean), keep = [];
  for (let i = 0; i < tokens.length; i++) {
    const tk = tokens[i];

    if (/^#\S/.test(tk)) { out.list = tk.slice(1).replace(/_/g, ' '); continue; }
    if (/^\*\S/.test(tk)) {
      const w = fold(tk.slice(1));
      const rep = Object.keys(REPEAT_WORDS).find(k => REPEAT_WORDS[k].includes(w));
      if (rep) { out.repeat = rep; continue; }

function renderPreview() {

  const c = parseCommand(raw), chips = [];

function onPick(e) { addPick = processPick(e); return addPick; }
async function processPick(e) {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { pendingImage = await shrink(f); } catch { pendingImage = f; }
  $('previewImg').src = URL.createObjectURL(pendingImage);
  $('preview').classList.add('show');
}
$('camInput').onchange = onPick;
$('galInput').onchange = onPick;
function clearPending() {
  pendingImage = null;
  if ($('previewImg').src) URL.revokeObjectURL($('previewImg').src);
  $('previewImg').removeAttribute('src'); $('preview').classList.remove('show');
}
$('previewDel').onclick = clearPending;
$('viewer').onclick = () => closeLayer('viewer');

// =====================================================================
//  Bearbeiten (Bottom Sheet, nur solange nicht erledigt)
// =====================================================================
function startEdit(t) {
  if (t.done) return;
  haptic();
  editingId = t.id; editImage = undefined; editImageURL = null;
  $('editBody').replaceChildren(editForm(t));
  showSheet('editSheet', () => {
    if (editImageURL) URL.revokeObjectURL(editImageURL);
    editingId = null; editImage = undefined; editImageURL = null;
    setTimeout(() => { if (!editingId) $('editBody').innerHTML = ''; }, 300);
  });
}
function cancelEdit() { if (editingId) closeLayer('editSheet'); }

function editForm(t) {
  const f = document.createElement('form'); f.className = 'edit-form'; f.autocomplete = 'off';
  const listOptions = [`<option value="">${esc(tr('noList'))}</option>`,
    ...lists.map(l => `<option value="${l.id}">${esc(l.name)}</option>`)].join('');
  const repeatOptions = Object.keys(REPEAT_KEYS).map(v => `<option value="${v}">${esc(repeatLabel(v))}</option>`).join('');
  f.innerHTML = `
    <label class="field"><input type="text" name="text" enterkeyhint="done"><span class="fl">${esc(tr('lblTask'))}</span></label>
    <label class="field"><textarea name="note" placeholder="${esc(tr('notePh'))}"></textarea><span class="fl">${esc(tr('lblNote'))}</span></label>
    <span class="label">${esc(tr('lblSubs'))}</span>
    <div class="subs-edit"></div>
    <div class="row-btns">
      <button type="button" class="btn tonal sl" data-a="addsub">${icon('add')}<span>${esc(tr('subNew'))}</span></button>
      <button type="button" class="btn text sl" data-a="absorb">${icon('list')}<span>${esc(tr('subFromTasks'))}</span></button>
    </div>
    <div class="absorb-list" hidden></div>
    <div class="edit-two">
      <label class="field"><select name="list">${listOptions}</select><span class="fl">${esc(tr('lblList'))}</span></label>
      <label class="field"><select name="repeat">${repeatOptions}</select><span class="fl">${esc(tr('lblRepeat'))}</span></label>
    </div>
    <div class="remind-row">
      <label class="field"><input type="datetime-local" name="remind"><span class="fl">${esc(tr('lblRemind'))}</span></label>
      <button type="button" class="icon-btn sl" data-a="noremind" aria-label="${esc(tr('aRemove'))}">${icon('close')}</button>
    </div>
    <label class="switch-row"><span>${esc(tr('starLabel'))}</span>
      <span class="switch"><input type="checkbox" name="star"><span class="track"></span><span class="knob"></span></span></label>
    <span class="label">${esc(tr('lblPhoto'))}</span>
    <div class="edit-photo">
      <img alt="" hidden>
      <button type="button" class="btn tonal sl" data-a="cam">${icon('camera')}<span>${esc(tr('cam'))}</span></button>
      <button type="button" class="btn tonal sl" data-a="gal">${icon('image')}<span>${esc(tr('gallery'))}</span></button>
      <button type="button" class="btn text danger sl" data-a="nophoto" hidden>${icon('delete')}<span>${esc(tr('removePhotoBtn'))}</span></button>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn text danger sl grow" data-a="delete" style="justify-content:flex-start;padding:0 8px">${icon('delete')}<span>${esc(tr('deleteTask'))}</span></button>
      <button type="button" class="btn text sl" data-a="cancel">${esc(tr('cancel'))}</button>
      <button type="submit" class="btn filled sl">${esc(tr('save'))}</button>
    </div>`;
  f.elements.text.value = t.text;
  f.elements.note.value = t.note || '';
  f.elements.list.value = t.list || '';
  f.elements.repeat.value = t.repeat || '';
  f.elements.star.checked = !!t.star;
  if (t.remind) f.elements.remind.value = toLocalInput(t.remind);

  const subsBox = f.querySelector('.subs-edit');
  const absorbed = new Set();   // Aufgaben, die beim Speichern zur Unteraufgabe werden
  const promoted = [];          // Unteraufgaben, die beim Speichern eigene Aufgaben werden
  const addSubRow = (s = { id: uid(), text: '', done: false }, fromTask = null) => {
    const row = document.createElement('div'); row.className = 'sub-edit sub-row'; row.dataset.id = s.id; row.dataset.done = s.done ? '1' : '';
    if (fromTask) row.dataset.from = fromTask;
    row.innerHTML = `<span class="sub-handle" aria-label="${esc(tr('aMove'))}">${icon('drag')}</span>` +
      `<input type="text" placeholder="${esc(tr('subPh'))}">` +
      `<button type="button" class="promote sl" aria-label="${esc(tr('aPromote'))}" title="${esc(tr('aPromote'))}">${icon('promote')}</button>` +
      `<button type="button" class="remove sl" aria-label="${esc(tr('aRemove'))}">${icon('close')}</button>`;
    row.querySelector('input').value = s.text;
    row.querySelector('.promote').onclick = () => {
      const text = row.querySelector('input').value.trim();
      if (row.dataset.from) absorbed.delete(row.dataset.from);
      else if (text) promoted.push(text);
      row.remove(); renderAbsorbList();
      if (text) toast(tr('willPromote', { x: text }));
    };
    row.querySelector('.remove').onclick = () => {
      if (row.dataset.from) absorbed.delete(row.dataset.from);
      row.remove(); renderAbsorbList();
    };
    row.querySelector('.sub-handle').addEventListener('pointerdown', e => dragSubRow(e, row, subsBox));
    subsBox.append(row);
    return row;
  };
  (t.subs || []).forEach(s => addSubRow(s));

  const absorbList = f.querySelector('.absorb-list');
  const renderAbsorbList = () => {
    if (absorbList.hidden) return;
    const candidates = todos
      .filter(x => !x.done && x.id !== t.id && !absorbed.has(x.id))
      .sort((a, b) => sortKey(a) - sortKey(b));
    absorbList.innerHTML = `<span class="label">${esc(candidates.length ? tr('tapToTake') : tr('noOtherTasks'))}</span>`;
    for (const x of candidates) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'absorb-item sl';
      b.textContent = x.text + (x.list && listName(x.list) ? '  · ' + listName(x.list) : '');
      b.onclick = () => {
        haptic();
        absorbed.add(x.id);
        addSubRow({ id: uid(), text: x.text, done: false }, x.id);
        for (const s2 of x.subs || []) addSubRow({ id: uid(), text: s2.text, done: s2.done });
        renderAbsorbList();
      };
      absorbList.append(b);
    }
  };

  const img = f.querySelector('.edit-photo img'), noPhoto = f.querySelector('[data-a=nophoto]');
  const current = editImage === undefined ? imgURL(t) : editImageURL;
  if (current) { img.src = current; img.hidden = false; noPhoto.hidden = false; }
  f.onclick = e => {
    const a = e.target.closest('[data-a]')?.dataset.a;
    if (a === 'cam') $('editCamInput').click();
    else if (a === 'gal') $('editGalInput').click();
    else if (a === 'nophoto') { if (editImageURL) URL.revokeObjectURL(editImageURL); editImage = null; editImageURL = null; img.hidden = true; noPhoto.hidden = true; }
    else if (a === 'addsub') addSubRow().querySelector('input').focus();
    else if (a === 'absorb') { absorbList.hidden = !absorbList.hidden; renderAbsorbList(); }
    else if (a === 'noremind') f.elements.remind.value = '';
    else if (a === 'cancel') cancelEdit();
    else if (a === 'delete') remove(t);
  };
  f.onsubmit = async e => {
    e.preventDefault();
    const text = f.elements.text.value.trim();
    if (!text) { f.elements.text.focus(); return; }
    if (editPick) { await editPick; editPick = null; }
    const subsBefore = (t.subs || []).map(x => ({ ...x }));
    t.text = text;
    t.note = f.elements.note.value.trim() || null;
    t.list = f.elements.list.value || null;
    t.repeat = f.elements.repeat.value;
    if (f.elements.star.checked && !t.star) t.order = topOrder();
    t.star = f.elements.star.checked;
    t.subs = [...subsBox.querySelectorAll('.sub-row')]
      .map(r => ({ id: r.dataset.id, text: r.querySelector('input').value.trim(), done: !!r.dataset.done }))
      .filter(s => s.text);
    const remind = f.elements.remind.value ? new Date(f.elements.remind.value).getTime() : null;
    const askPermission = remind && remind !== t.remind;
    t.remind = remind;
    if (editImage !== undefined) { t.image = editImage; dropURL(t.id); }
    t.edited = Date.now();
    await dbPut(t);
    if (askPermission) ensureNotifyPermission().then(() => scheduleReminder(t));
    else await scheduleReminder(t);
    const gone = todos.filter(x => absorbed.has(x.id));
    for (const x of gone) { await cancelReminder(x); await dbDel(x.id); }
    todos = todos.filter(x => !absorbed.has(x.id));
    const fresh = [];
    for (const text2 of promoted) {
      const n = { id: uid(), text: text2, done: false, created: Date.now(), doneAt: null, image: null,
        list: t.list, order: topOrder(), star: false, subs: [], repeat: '', remind: null, note: null };
      await dbPut(n); todos.push(n); fresh.push(n);
    }
    haptic('confirm');
    cancelEdit(); render();
    if (gone.length || fresh.length) {
      const parts = [];
      if (gone.length) parts.push(gone.length > 1 ? tr('tookOverN', { n: gone.length }) : tr('tookOver1'));
      if (fresh.length) parts.push(fresh.length > 1 ? tr('newTasksN', { n: fresh.length }) : tr('newTasks1'));
      toast(parts.join(', '), gone.length ? async () => {
        for (const x of gone) { await dbPut(x); todos.push(x); scheduleReminder(x); }
        t.subs = subsBefore; await dbPut(t);
        render();
      } : null);
    }
    if (remind && remind <= Date.now()) toast(tr('remindPast'));
  };
  return f;
}
// Unteraufgaben im Bearbeiten-Sheet per Griff verschieben
function dragSubRow(e, row, box) {
  e.preventDefault();
  haptic('long');
  row.classList.add('sub-dragging');
  const move = ev => {
    if (ev.pointerId !== e.pointerId) return;
    ev.preventDefault();
    const rows = [...box.querySelectorAll('.sub-row:not(.sub-dragging)')];
    const before = rows.find(r => ev.clientY < r.getBoundingClientRect().top + r.offsetHeight / 2);
    if (before) { if (before !== row.nextElementSibling) box.insertBefore(row, before); }
    else if (rows.length && box.lastElementChild !== row) box.append(row);
  };
  const up = ev => {
    if (ev.pointerId !== e.pointerId) return;
    row.classList.remove('sub-dragging');
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
  };
  addEventListener('pointermove', move, { passive: false });
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
}
function onEditPick(e) { editPick = processEditPick(e); return editPick; }
async function processEditPick(e) {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  let blob; try { blob = await shrink(file); } catch { blob = file; }
  if (editImageURL) URL.revokeObjectURL(editImageURL);
  editImage = blob; editImageURL = URL.createObjectURL(blob);
  const form = document.querySelector('.edit-form');
  if (form) {
    const img = form.querySelector('.edit-photo img');
    img.src = editImageURL; img.hidden = false;
    form.querySelector('[data-a=nophoto]').hidden = false;
  }
}
$('editCamInput').onchange = onEditPick;
$('editGalInput').onchange = onEditPick;

// ---------- Dialog: Frage, Bestätigung oder Eingabe ----------
// ask({ title, body, input: { label, value }, ok, cancel, danger }) → Promise:
// mit input den eingegebenen Text (oder null), sonst true (oder null).
// Zurück-Taste und Tippen daneben brechen ab. cancel: null = nur ein Knopf.
function ask({ title, body = '', input = null, ok = tr('save'), cancel = tr('cancel'), danger = false }) {
  return new Promise(res => {
    let result = null;
    $('dlgTitle').textContent = title;
    $('dlgBody').textContent = body; $('dlgBody').classList.toggle('hidden', !body);
    const inp = $('dlgInput');
    $('dlgField').classList.toggle('hidden', input === null);
    if (input !== null) { inp.value = input.value || ''; $('dlgLabel').textContent = input.label || ''; }
    $('dlgOk').textContent = ok; $('dlgOk').classList.toggle('danger-filled', danger);
    $('dlgCancel').textContent = cancel || ''; $('dlgCancel').classList.toggle('hidden', cancel === null);
    const finish = v => { result = v; closeLayer('dlg'); };
    $('dlgOk').onclick = () => {
      if (input === null) { haptic(danger ? 'reject' : 'confirm'); finish(true); return; }
      const v = inp.value.trim();
      if (!v) { inp.focus(); return; }
      haptic('confirm'); finish(v);
    };
    $('dlgCancel').onclick = () => finish(null);
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('dlgOk').click(); } };
    showSheet('dlg', () => res(result));
    setTimeout(() => (input !== null ? inp : $('dlgOk')).focus(), 60);
  });
}

// ---------- Listen verwalten ----------
function renderListManage() {
  const box = $('listManage'); box.innerHTML = '';
  for (const l of lists) {
    const row = document.createElement('div'); row.className = 'lm';
    row.innerHTML = `<input type="text"><button class="icon-btn sl" aria-label="${esc(tr('aRemoveList'))}">${icon('delete')}</button>`;
    const inp = row.querySelector('input'); inp.value = l.name;
    inp.onchange = () => { l.name = inp.value.trim() || l.name; saveLists(); render(); };
    row.querySelector('button').onclick = async () => {
      const sure = await ask({ title: tr('removeListTitle'), body: tr('confirmRemoveList', { x: l.name }), ok: tr('dlgRemove'), danger: true });
      if (!sure) return;
      lists = lists.filter(x => x !== l); saveLists();
      for (const t of todos.filter(t => t.list === l.id)) { t.list = null; await dbPut(t); }
      renderListManage(); render();
    };
    box.append(row);
  }
}
async function newList() {
  haptic();
  const name = await ask({ title: tr('newList'), input: { label: tr('listNameLbl') }, ok: tr('dlgCreate') });
  if (!name) return;
  const l = { id: uid(), name };
  lists.push(l); saveLists(); currentList = l.id; localStorage.setItem('todo-current-list', l.id);
  haptic('confirm');
  renderListManage(); render();
}
$('addListBtn').onclick = newList;

// ---------- Sicherung ----------
const blobToDataURL = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
async function dataURLToBlob(u) { return (await fetch(u)).blob(); }
$('exportBtn').onclick = async () => {
  // Gleiches Format wie "To Do:" – Sicherungen lassen sich zwischen beiden Apps austauschen
  const data = {
    app: 'todo', version: 2, exported: Date.now(),
    settings: { theme: localStorage.getItem('todo-theme'), mode: localStorage.getItem('todo-mode') },
    lists,
    todos: await Promise.all(todos.map(async t => ({ ...t, image: t.image ? await blobToDataURL(t.image) : null }))),
  };
  const json = JSON.stringify(data);
  const stamp = new Date().toISOString().slice(0, 10);
  const name = `tasks-backup-${stamp}.json`;
  try {
    if (Native.Filesystem && Native.Share) {
      const res = await Native.Filesystem.writeFile({ path: name, data: json, directory: 'CACHE', encoding: 'utf8' });
      await Native.Share.share({ title: tr('appTitle') + ' Backup', files: [res.uri], dialogTitle: tr('shareDialog') });
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }
    toast(todos.length === 1 ? tr('backupCreated1') : tr('backupCreated', { n: todos.length }));
  } catch (e) { toast(tr('exportCancelled')); console.warn(e); }
};
$('importBtn').onclick = () => $('importInput').click();
$('importInput').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'todo' || !Array.isArray(data.todos)) throw new Error(tr('notBackup'));
    if (!await ask({ title: tr('importTitle'), body: data.todos.length === 1 ? tr('confirmImport1') : tr('confirmImport', { n: data.todos.length }), ok: tr('import') })) return;
    for (const l of data.lists || []) if (!lists.some(x => x.id === l.id)) lists.push(l);
    saveLists();
    for (const raw of data.todos) {
      const t = { ...raw, image: raw.image ? await dataURLToBlob(raw.image) : null };
      dropURL(t.id);
      await dbPut(t);
      todos = todos.filter(x => x.id !== t.id); todos.push(t);
      scheduleReminder(t);
    }
    renderListManage(); render();
    toast(data.todos.length === 1 ? tr('imported1') : tr('imported', { n: data.todos.length }));
  } catch (err) {
    // Kaputtes JSON: verständlich sagen, statt die Fehlermeldung des Parsers zu zeigen
    await ask({ title: tr('importFailedTitle'), body: err instanceof SyntaxError ? tr('notBackup') : err.message, ok: tr('close'), cancel: null });
  }
};

// ---------- Filter ----------
function setFilter(f) {
  filter = f;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.f === f));
  render();
}
$('tabs').onclick = e => { const b = e.target.closest('button'); if (b?.dataset.f) { haptic(); setFilter(b.dataset.f); } };

// ---------- Suche ----------
function openSearch() {
  $('titleRow').classList.add('hidden'); $('searchRow').classList.remove('hidden');
  $('searchInput').focus();
  openLayer('search', () => {
    query = ''; $('searchInput').value = ''; $('searchClear').classList.add('hidden');
    $('searchRow').classList.add('hidden'); $('titleRow').classList.remove('hidden'); render();
  });
}
$('searchBtn').onclick = () => { haptic(); openSearch(); };
$('searchClose').onclick = () => closeLayer('search');
$('searchInput').oninput = e => { query = e.target.value; $('searchClear').classList.toggle('hidden', !query); render(); };
$('searchClear').onclick = () => { query = ''; $('searchInput').value = ''; $('searchClear').classList.add('hidden'); $('searchInput').focus(); render(); };

// ---------- Einstellungen ----------
$('themeBtn').onclick = () => { haptic(); renderSwatches(); renderListManage(); $('hapticToggle').checked = hapticsOn; showSheet('themeSheet'); };
$('themeClose').onclick = () => closeLayer('themeSheet');
$('hapticToggle').onchange = e => { hapticsOn = e.target.checked; localStorage.setItem('todo-haptics', hapticsOn ? 'on' : 'off'); haptic(); };

// ---------- Leiste beim Scrollen, FAB einklappen ----------
let lastY = 0;
addEventListener('scroll', () => {
  const y = scrollY;
  $('appbar').classList.toggle('scrolled', y > 4);
  $('fab').classList.toggle('small', y > 40 && y > lastY);
  if (y < lastY - 4) $('fab').classList.remove('small');
  lastY = y;
}, { passive: true });

// ---------- Installieren (nur Web) ----------
let installEvt;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); if (window.Capacitor) return; installEvt = e; $('installBtn').classList.add('show'); });
$('installBtn').onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('installBtn').classList.remove('show'); };
window.addEventListener('appinstalled', () => $('installBtn').classList.remove('show'));

// ---------- Start ----------
(async () => {
  applyIcons();
  applyI18n();
  $('langSelect').value = lang;
  // Material You: Akzentfarbe des Systems holen (Android 12+)
  if (Native.TodoWidget) {
    try { const c = await Native.TodoWidget.systemColors(); if (c.available) dynamicSeed = c.seed; } catch {}
  }
  if (themePref === 'dynamic' && !dynamicSeed) themePref = 'purple';
  applyMode();
  db = await openDB();
  todos = await dbAll();
  await handleWidget();   // im Widget / auf der Uhr Abgehaktes zuerst übernehmen
  render();
  if (!localStorage.getItem('todo-tut-done')) openTutorial();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if ('serviceWorker' in navigator && !window.Capacitor) navigator.serviceWorker.register('sw.js');
  if (!Native.LocalNotifications) for (const t of todos) if (t.remind && !t.done) scheduleReminder(t);
  // Hintergrundbild gewechselt? Beim Zurückkehren Farben neu holen
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden || !Native.TodoWidget) return;
    try {
      const c = await Native.TodoWidget.systemColors();
      if (c.available && c.seed !== dynamicSeed) { dynamicSeed = c.seed; if (themePref === 'dynamic') applyColors(); renderSwatches(); syncWidget(); }
    } catch {}
  });
})();
</script>
